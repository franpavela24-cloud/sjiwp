<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
    <style>
        svg{
            border: 1px solid black
        }
        
    </style>
</head>
<body>
    <svg  width="600" height="600">
        <rect
            x="50"
            y="50"
            width="200"
            height="150"
            fill="blue"
            stroke="green"
            stroke-width="5"
        />
        <circle
                cx="350"
                cy="375"
                r="50"
                fill="yellow"
        />
        <ellipse
        cx="400"
        cy="200"
        rx="100"
        ry="50"
        fill="purple"

        />
        <line
        x1="50"
        x2="125"
        y1="500"
        y2="425"
        stroke="red"
        stroke-width="5"
        />
    </svg>
</body>
</html>
